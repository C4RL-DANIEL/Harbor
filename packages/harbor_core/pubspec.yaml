name: harbor_core
description: >-
  Harbor's portable model runtime: a byte-level BPE tokenizer, a decoder-only
  transformer (multi-head latent attention + fine-grained mixture of experts)
  with hand-written backpropagation, LoRA adapters that are actually applied at
  inference, an on-device training session with live progress, a corpus
  pipeline for device and web text, and a tool-calling chat engine.

  The package is deliberately Flutter-free and dart:io-free so the exact same
  code runs on Android (Dart AOT), on the Dart VM update server, and compiled to
  JavaScript in the Flutter Web admin dashboard.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  collection: ^1.18.0
  crypto: ^3.0.3
  http: ^1.2.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0