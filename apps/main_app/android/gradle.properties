# Harbor — Gradle daemon and Android tooling configuration.

# R8 runs in-process during the release build, so give the daemon enough heap to
# shrink the Flutter engine + plugin graph without thrashing. 4G heap + 2G
# metaspace stays inside the ~7 GB available on GitHub's ubuntu-latest runners.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError

# AndroidX is mandatory for the Flutter embedding and every current plugin.
android.useAndroidX=true

# Rewrites legacy support-library references (including those coming from older
# transitive dependencies) onto AndroidX. Kept on for maximal plugin
# compatibility; it is a no-op once every dependency is AndroidX-native.
android.enableJetifier=true

# Each module gets its own R class instead of a merged one for every dependency.
# Faster builds and smaller output, and required by many modern plugins.
android.nonTransitiveRClass=true

# AGP 8.1.0 does not officially know about compileSdk 34; this silences the
# resulting warning rather than downgrading the compile SDK.
android.suppressUnsupportedCompileSdk=34