// Harbor — root Gradle build for the Android host app.
//
// The root project owns no code of its own: it centralises repositories,
// aligns every module's compile SDK, and redirects each module's build output
// into the shared ../build directory that the Flutter tool inspects for the
// produced APK.

// ---------------------------------------------------------------------------
// Plugin compile-SDK alignment
// ---------------------------------------------------------------------------
// Every Flutter plugin is its own Gradle module and compiles with its own
// `android.compileSdkVersion`, which is frequently far below the app's:
// ota_update 6.0.0 still declares `compileSdkVersion 28`. That plugin also
// depends on androidx.legacy:legacy-support-v4, which drags in a modern
// androidx.core whose resources reference `android:attr/lStar` — an attribute
// introduced in API 31. AAPT resolves resources against the *module's* compile
// SDK, so the release build aborts in `:ota_update:verifyReleaseResources`
// with "AAPT: error: resource android:attr/lStar not found" even though the app
// itself compiles against SDK 34.
//
// Raising every plugin module to the app's own compile SDK removes the mismatch
// without patching anything in the pub cache. The value is read back from :app
// (which in turn took it from the Flutter Gradle plugin's
// `flutter.compileSdkVersion`), so this file never hard-codes a second SDK
// number that could drift from the real toolchain.
//
// This block sits at the very top of the script on purpose. Gradle runs
// `afterEvaluate` callbacks in registration order and refuses to register one
// on an already-evaluated project, so registering here — during root project
// configuration, before `evaluationDependsOn(":app")` below forces :app to
// evaluate and before any plugin project's build script runs — is what
// guarantees the override lands before AGP reads the DSL to create variants.
// The `state.executed` branch only covers a project Gradle has already
// evaluated by the time this runs, where the DSL has therefore already been
// applied and the value can be written in place.
subprojects { subproject ->
    def alignCompileSdk = {
        def androidExtension = subproject.extensions.findByName('android')
        if (androidExtension == null) {
            return
        }
        def appAndroid = rootProject.project(':app').extensions.findByName('android')
        if (appAndroid == null) {
            return
        }
        def appCompileSdk = appAndroid.compileSdk
        if (appCompileSdk != null && androidExtension.compileSdk != appCompileSdk) {
            subproject.logger.lifecycle(
                "Harbor: aligning ${subproject.path} compileSdk " +
                "${androidExtension.compileSdk} -> ${appCompileSdk}")
            androidExtension.compileSdk = appCompileSdk
        }
    }

    if (subproject.state.executed) {
        alignCompileSdk()
    } else {
        subproject.afterEvaluate { alignCompileSdk() }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Keep build artifacts in <flutter project>/build rather than android/build, so
// `flutter build apk` finds them at the documented path.
rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}