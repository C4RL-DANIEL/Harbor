name: update_server
description: >-
  Harbor update server: a shelf HTTP service that publishes OTA release
  metadata and the dynamic feature-flag matrix, plus a Flutter Web admin
  dashboard (lib/main.dart) that edits that state live.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  # Flutter is required only by the web admin dashboard (lib/main.dart).
  # bin/server.dart and lib/src/** run on the pure Dart VM and never import it.
  flutter:
    sdk: flutter

  # ---- HTTP service ------------------------------------------------------
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_static: ^1.1.2

  # ---- Versioning --------------------------------------------------------
  pub_semver: ^2.1.4

  # ---- CLI / networking / formatting ------------------------------------
  args: ^2.5.0
  http: ^1.2.0
  intl: ^0.19.0

  # ---- Browser bindings (lib/main.dart only) -----------------------------
  # Replaces the deprecated dart:html for the web-only admin dashboard.
  web: ^1.0.0

  # ---- Shared model and tool runtime ------------------------------------
  # Harbor's model, tokenizer, corpus and tool layer. It is deliberately free
  # of both dart:io and Flutter so the same source compiles to the server VM,
  # the Android AOT image and the browser bundle the dashboard runs.
  harbor_core:
    path: ../../packages/harbor_core

dev_dependencies:
  # `package:test` (not flutter_test) drives test/server_test.dart so the suite
  # runs on the plain Dart VM via `dart test`. That is what proves lib/src/**
  # and bin/server.dart stay Flutter-free.
  test: ^1.25.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true