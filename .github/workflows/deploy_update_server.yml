name: Deploy Update Server

# Deploys the Dart shelf server verification artifact and the Flutter Web admin
# dashboard. Runs on pushes to main that touch the update server app or this
# workflow, and on manual dispatch.
on:
  push:
    branches:
      - main
    paths:
      - 'apps/update_server/**'
      - '.github/workflows/deploy_update_server.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialise this workflow's own deploys. It is deliberately *not* the same
# group as build_and_release.yml: entering a concurrency group cancels any run
# still pending in it, so a shared group would let a server push cancel a queued
# (and expensive) release build. Overlapping deploys from the two workflows are
# harmless because each one publishes the complete site — see
# .github/scripts/build_pages_site.sh.
concurrency:
  group: pages-update-server
  cancel-in-progress: false

env:
  # apps/update_server has a `flutter: sdk: flutter` dependency (needed by
  # lib/main.dart, the web dashboard), so `dart pub get` can never resolve it:
  # pub refuses to resolve a package that requires the Flutter SDK. Every job
  # below therefore installs Flutter and resolves with `flutter pub get`, then
  # uses the Dart CLI bundled with that same Flutter SDK for analyze, test and
  # compile. Using one SDK for both keeps the analyzer version identical to the
  # one that builds the web app.
  FLUTTER_VERSION: '3.24.5'
  # Documented fallback used when HARBOR_API_BASE_URL is unset. This is the
  # origin the web dashboard calls for the admin API.
  FALLBACK_API_BASE_URL: 'https://harbor-update-server.example.com'
  # Site-relative subdirectory the dashboard is served from. The absolute base
  # href passed to `flutter build web` is this value prefixed with the Pages
  # project path reported by actions/configure-pages (a project site is served
  # from /<repo>/, so the href is /<repo>/update-admin/ and not /update-admin/).
  ADMIN_BASE_HREF: '/update-admin/'
  # Port for the compiled-server smoke test.
  SMOKE_TEST_PORT: '8080'

jobs:
  verify-server:
    name: Analyze and test update server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/update_server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preflight - required server sources
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for required in pubspec.yaml bin/server.dart lib/main.dart; do
            if [ ! -f "$required" ]; then
              echo "::error::Missing required file apps/update_server/${required}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::apps/update_server is incomplete; aborting verification."
            exit 1
          fi

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies (flutter pub get)
        run: flutter pub get

      # Architectural invariant: the HTTP service must stay runnable on a plain
      # Dart VM with no Flutter engine. Only lib/main.dart (the web dashboard)
      # may import Flutter, and nothing under bin/ or lib/src/ may.
      - name: Verify server sources are Flutter-free
        shell: bash
        run: |
          set -euo pipefail
          offenders="$(grep -rln "package:flutter" bin lib/src || true)"
          if [ -n "$offenders" ]; then
            echo "::error::These server sources import Flutter and would break the headless Dart VM build:"
            printf '%s\n' "$offenders"
            exit 1
          fi
          echo "bin/ and lib/src/ are Flutter-free."

      - name: Analyze (fatal infos and warnings)
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -d test ] && find test -name '*_test.dart' -print -quit | grep -q .; then
            dart test
          else
            echo "::warning::No Dart tests found under apps/update_server/test; skipping dart test."
          fi

      - name: Server verification summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Update server verification"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| flutter pub get | passed |"
            echo "| Flutter-free bin/ + lib/src/ | passed |"
            echo "| dart analyze --fatal-infos --fatal-warnings | passed |"
            echo "| dart test | passed or not configured |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-admin-web:
    name: Build and deploy admin dashboard
    runs-on: ubuntu-latest
    needs: verify-server
    if: ${{ needs.verify-server.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: apps/update_server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preflight - required web dashboard sources
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for required in pubspec.yaml lib/main.dart web/index.html; do
            if [ ! -f "$required" ]; then
              echo "::error::Missing required file apps/update_server/${required}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::The Flutter Web dashboard is not buildable; aborting."
            exit 1
          fi

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Resolve web build settings
        id: settings
        shell: bash
        env:
          API_BASE_URL: ${{ vars.HARBOR_API_BASE_URL }}
          FALLBACK: ${{ env.FALLBACK_API_BASE_URL }}
          ADMIN_SUBDIR: ${{ env.ADMIN_BASE_HREF }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail

          api_base_url="${API_BASE_URL:-}"
          if [ -z "$api_base_url" ]; then
            api_base_url="${FALLBACK}"
            echo "::warning::Repository variable HARBOR_API_BASE_URL is empty; falling back to ${api_base_url}."
          fi

          # actions/configure-pages reports the path the site is served from:
          # empty for a user/organisation site, "/<repo>" for a project site.
          # The dashboard lives under that path, so its absolute base href is
          # base_path + subdirectory. Getting this wrong produces a page whose
          # index.html loads but whose main.dart.js is requested from the
          # domain root and 404s.
          base_path="${PAGES_BASE_PATH:-}"
          if [ "$base_path" = "/" ]; then
            base_path=""
          fi
          case "$base_path" in
            "") ;;
            /*) ;;
            *) base_path="/${base_path}" ;;
          esac
          base_path="${base_path%/}"

          # Normalise the subdirectory so an empty or malformed value cannot
          # break the web build: it must start and end with a single slash.
          subdir="${ADMIN_SUBDIR:-}"
          case "$subdir" in
            /*) ;;
            *) subdir="/${subdir}" ;;
          esac
          case "$subdir" in
            */) ;;
            *) subdir="${subdir}/" ;;
          esac
          if [ "$subdir" = "//" ] || [ "$subdir" = "/" ]; then
            subdir="/update-admin/"
          fi

          base_href="${base_path}${subdir}"

          {
            echo "api_base_url=${api_base_url}"
            echo "base_href=${base_href}"
          } >> "$GITHUB_OUTPUT"

          echo "Web build settings: base_href=${base_href} api_base_url=${api_base_url}"

      # actions/deploy-pages replaces the whole site with the uploaded artifact.
      # This workflow owns the dashboard, build_and_release.yml owns the update
      # manifest, so this step reconstructs the manifest from the published
      # GitHub Release before assembling the site. Without it, deploying the
      # dashboard would delete latest_version.json.
      - name: Resolve release metadata for the manifest
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          empty_result() {
            {
              echo "version="
              echo "tag="
              echo "sha256="
              echo "size_bytes="
              echo "published_at="
              echo "changelog_file="
            } >> "$GITHUB_OUTPUT"
          }

          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::gh CLI is unavailable; publishing the dashboard without latest_version.json."
            empty_result
            exit 0
          fi

          tag="$(gh release view --repo "$REPOSITORY" --json tagName --jq '.tagName' 2>/dev/null || true)"
          if [ -z "$tag" ]; then
            echo "::warning::No GitHub Release exists yet; publishing the dashboard without latest_version.json."
            empty_result
            exit 0
          fi

          work_dir="$(mktemp -d)"
          if ! gh release download "$tag" --repo "$REPOSITORY" --pattern SHA256SUMS --dir "$work_dir" 2>/dev/null; then
            echo "::warning::Release ${tag} has no SHA256SUMS asset; publishing the dashboard without latest_version.json."
            empty_result
            exit 0
          fi

          sha256="$(awk '$2 == "app-release.apk" { print $1 }' "${work_dir}/SHA256SUMS" | head -n1)"
          size_bytes="$(gh release view "$tag" --repo "$REPOSITORY" --json assets \
            --jq '.assets[] | select(.name == "app-release.apk") | .size' 2>/dev/null || true)"
          published_at="$(gh release view "$tag" --repo "$REPOSITORY" --json publishedAt \
            --jq '.publishedAt' 2>/dev/null || true)"

          if [ -z "$sha256" ] || [ -z "$size_bytes" ]; then
            echo "::warning::Release ${tag} does not carry a usable app-release.apk; publishing the dashboard without latest_version.json."
            empty_result
            exit 0
          fi

          gh release view "$tag" --repo "$REPOSITORY" --json body --jq '.body' > "${work_dir}/CHANGELOG.md"
          if [ ! -s "${work_dir}/CHANGELOG.md" ]; then
            printf 'Release %s\n' "$tag" > "${work_dir}/CHANGELOG.md"
          fi

          version="${tag#v}"

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "sha256=${sha256}"
            echo "size_bytes=${size_bytes}"
            echo "published_at=${published_at}"
            echo "changelog_file=${work_dir}/CHANGELOG.md"
          } >> "$GITHUB_OUTPUT"

          echo "Manifest inputs resolved from release ${tag} (version ${version}, ${size_bytes} bytes)."

      - name: Assemble the complete Pages site
        shell: bash
        env:
          SITE_DIR: ${{ github.workspace }}/site
          REPO: ${{ github.repository }}
          API_BASE_URL: ${{ steps.settings.outputs.api_base_url }}
          ADMIN_BASE_HREF: ${{ steps.settings.outputs.base_href }}
          MIN_SUPPORTED_VERSION: ${{ vars.HARBOR_MIN_SUPPORTED_VERSION }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          SHA256: ${{ steps.release.outputs.sha256 }}
          SIZE_BYTES: ${{ steps.release.outputs.size_bytes }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
          CHANGELOG_FILE: ${{ steps.release.outputs.changelog_file }}
        run: bash "${{ github.workspace }}/.github/scripts/build_pages_site.sh"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy admin dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        if: ${{ always() }}
        shell: bash
        env:
          BASE_HREF: ${{ steps.settings.outputs.base_href }}
          API_BASE_URL: ${{ steps.settings.outputs.api_base_url }}
          VERSION: ${{ steps.release.outputs.version }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "### Update server deployment"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Dashboard base href | \`${BASE_HREF}\` |"
            echo "| API base URL | \`${API_BASE_URL}\` |"
            echo "| Manifest version | \`${VERSION:-not republished}\` |"
            echo "| Pages URL | ${PAGE_URL:-not deployed} |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-server-image:
    name: Compile and smoke-test shelf server
    runs-on: ubuntu-latest
    needs: verify-server
    # Manual dispatch always builds the binary; pushes only when the
    # HARBOR_PUBLISH_IMAGE repository variable is exactly 'true'.
    if: ${{ needs.verify-server.result == 'success' && (github.event_name == 'workflow_dispatch' || vars.HARBOR_PUBLISH_IMAGE == 'true') }}
    defaults:
      run:
        working-directory: apps/update_server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies (flutter pub get)
        run: flutter pub get

      - name: Compile shelf server to a native executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          # bin/server.dart is Flutter-free, so it compiles on the pure Dart VM
          # even though the package as a whole has a Flutter SDK dependency.
          dart compile exe bin/server.dart -o build/harbor-update-server
          if [ ! -s build/harbor-update-server ]; then
            echo "::error::Compiled server binary is missing or empty."
            exit 1
          fi
          chmod +x build/harbor-update-server
          ls -l build/harbor-update-server

      - name: Smoke-test compiled server
        shell: bash
        env:
          PORT: ${{ env.SMOKE_TEST_PORT }}
        run: |
          set -euo pipefail

          binary="build/harbor-update-server"
          state_dir="$(mktemp -d)"
          log_file="$(mktemp)"

          export HARBOR_ALLOW_DEV_TOKEN=true
          export HARBOR_ADMIN_TOKEN=dev-smoke-test-token
          export HARBOR_PORT="${PORT}"
          export PORT="${PORT}"
          export HARBOR_STATE_FILE="${state_dir}/state.json"

          # Always tear the server down, even on early failure.
          trap 'if [ -n "${server_pid:-}" ]; then kill "${server_pid}" 2>/dev/null || true; wait "${server_pid}" 2>/dev/null || true; fi' EXIT

          "$binary" >"$log_file" 2>&1 &
          server_pid=$!

          ready=0
          for attempt in $(seq 1 30); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::Server exited before becoming ready."
              cat "$log_file" || true
              exit 1
            fi
            if curl --silent --fail --max-time 2 "http://127.0.0.1:${PORT}/health" >/dev/null; then
              ready=1
              echo "Server ready after ${attempt} attempt(s)."
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::Server did not answer /health within 30 seconds."
            cat "$log_file" || true
            exit 1
          fi

          echo "--- GET /health ---"
          curl --silent --show-error --fail --max-time 5 \
            "http://127.0.0.1:${PORT}/health" | tee /tmp/harbor-health.json
          echo

          echo "--- GET /api/v1/update-check?version=1.0.0&platform=android ---"
          curl --silent --show-error --fail --max-time 5 \
            "http://127.0.0.1:${PORT}/api/v1/update-check?version=1.0.0&platform=android" \
            | tee /tmp/harbor-update-check.json
          echo

          python3 - <<'PY'
          import json
          import sys

          path = "/tmp/harbor-update-check.json"
          try:
              with open(path, encoding="utf-8") as handle:
                  payload = json.load(handle)
          except (OSError, ValueError) as error:
              print(f"::error::update-check response is not valid JSON: {error}")
              sys.exit(1)

          if not isinstance(payload, dict):
              print("::error::update-check response is not a JSON object.")
              sys.exit(1)

          if "latest_version" not in payload:
              print("::error::update-check response is missing 'latest_version'.")
              sys.exit(1)

          if "platform" in payload and payload["platform"] != "android":
              print(f"::error::update-check returned platform {payload['platform']!r}, expected 'android'.")
              sys.exit(1)

          latest = payload["latest_version"]
          if not isinstance(latest, str):
              print(f"::error::latest_version must be a string, got {type(latest).__name__}.")
              sys.exit(1)

          print(f"Smoke test OK: latest_version={latest!r}")
          PY

      - name: Upload compiled server binary
        uses: actions/upload-artifact@v4
        with:
          name: harbor-update-server-linux-x64
          path: apps/update_server/build/harbor-update-server
          if-no-files-found: error
          retention-days: 14

      - name: Server build summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          binary="build/harbor-update-server"
          if [ -s "$binary" ]; then
            size_bytes="$(stat -c '%s' "$binary")"
          else
            size_bytes="not built"
          fi
          {
            echo "### Compiled server artifact"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Binary | \`apps/update_server/${binary}\` |"
            echo "| Size (bytes) | ${size_bytes} |"
            echo "| Smoke test | /health + /api/v1/update-check |"
            echo "| Trigger | \`${GITHUB_EVENT_NAME}\` |"
          } >> "$GITHUB_STEP_SUMMARY"