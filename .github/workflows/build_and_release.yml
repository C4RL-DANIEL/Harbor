name: Build and Release

# Triggered by semantic-version tags (v1.2.3 and pre-release tags such as
# v1.2.3-rc.1) and by a manual dispatch that supplies a version string.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, with or without a leading v (e.g. 1.2.3 or v1.2.3-rc.1)'
        required: true
        type: string
      dry_run:
        description: 'Build and test only: skip the GitHub Release and the Pages deployment'
        required: false
        default: false
        type: boolean

# GitHub Pages deployment needs id-token + pages, and releasing needs contents.
permissions:
  contents: write
  pages: write
  id-token: write

# Every run of this workflow publishes to the same GitHub Pages site, so all
# releases must serialize rather than cancel one another mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.24.5'
  JAVA_VERSION: '17'
  # Name of the single artifact bundle shared by the release and pages jobs.
  RELEASE_ARTIFACT_NAME: 'harbor-release-assets'
  # Site-relative subdirectory the dashboard is served from. The absolute base
  # href handed to `flutter build web` is this value prefixed with the Pages
  # project path reported by actions/configure-pages (a project site is served
  # from /<repo>/, so the href is /<repo>/update-admin/). It is kept identical
  # to deploy_update_server.yml so both workflows assemble the same layout.
  ADMIN_BASE_HREF: '/update-admin/'

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/main_app
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      build_number: ${{ steps.version.outputs.build_number }}
      sha256: ${{ steps.checksum.outputs.sha256 }}
      size_bytes: ${{ steps.checksum.outputs.size_bytes }}
      apk_path: ${{ steps.checksum.outputs.apk_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Preflight - required application files
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for required in pubspec.yaml lib/main.dart; do
            if [ ! -f "$required" ]; then
              echo "::error::Missing required file apps/main_app/${required}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::apps/main_app is not buildable; aborting release build."
            exit 1
          fi

      - name: Resolve version, tag and build number
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          raw_version=""
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            raw_version="${VERSION_INPUT:-}"
          else
            raw_version="${REF_NAME:-}"
          fi
          raw_version="${raw_version#refs/tags/}"
          raw_version="${raw_version#v}"

          pubspec_version=""
          if [ -f pubspec.yaml ]; then
            pubspec_version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]#]+).*/\1/p' pubspec.yaml | head -n1)"
            pubspec_version="${pubspec_version%\"}"
            pubspec_version="${pubspec_version#\"}"
            pubspec_version="${pubspec_version%\'}"
            pubspec_version="${pubspec_version#\'}"
          fi

          if [ -n "$raw_version" ]; then
            version="$raw_version"
            if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
              tag="v${version}"
            else
              tag="${REF_NAME}"
            fi
          else
            # Tag was not parseable: fall back to the version declared in pubspec.yaml.
            version="${pubspec_version%%+*}"
            tag="v${version}"
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Could not derive a valid semantic version (got '${version}')."
            exit 1
          fi

          if [ "$version" != "${version#v}" ]; then
            echo "::error::Version '${version}' still carries a leading v."
            exit 1
          fi

          if [ -n "$pubspec_version" ]; then
            tag_base="${version%%-*}"
            tag_base="${tag_base%%+*}"
            pub_base="${pubspec_version%%-*}"
            pub_base="${pub_base%%+*}"
            if [ "$pub_base" != "$tag_base" ]; then
              echo "::warning::apps/main_app/pubspec.yaml declares '${pubspec_version}' but the release version is '${version}'."
            fi
          fi

          # Monotonic build number derived from the workflow run; falls back to
          # 1 for local/act runs where GITHUB_RUN_NUMBER is not injected.
          build_number="${RUN_NUMBER:-1}"
          if ! printf '%s' "$build_number" | grep -Eq '^[0-9]+$'; then
            build_number=1
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "build_number=${build_number}"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved version=${version} tag=${tag} build_number=${build_number}"

      - name: Set up Java ${{ env.JAVA_VERSION }} (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # apps/main_app/android/app/build.gradle pins ndkVersion to the Flutter
      # 3.24.5 default so the strip tool AGP uses matches the pinned toolchain.
      # The ubuntu-latest image only ships NDK 27/28/29, so install the pinned
      # revision up front rather than leaving it to AGP's implicit SDK download
      # (which turns a missing NDK into a late, opaque failure in
      # :app:stripReleaseDebugSymbols). The step is a no-op once the NDK exists,
      # which keeps a warm/cached runner fast.
      - name: Ensure the pinned Android NDK is installed
        shell: bash
        env:
          NDK_VERSION: '23.1.7779620'
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -d "${sdk_root}/ndk/${NDK_VERSION}" ]; then
            echo "NDK ${NDK_VERSION} is already installed at ${sdk_root}/ndk/${NDK_VERSION}."
            exit 0
          fi

          sdkmanager="$(find "${sdk_root}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -n1)"
          if [ -z "${sdkmanager}" ]; then
            echo "::error::sdkmanager was not found under ${sdk_root}/cmdline-tools."
            exit 1
          fi

          # pipefail is disabled for this one command so `yes` being killed by
          # SIGPIPE (its normal exit once sdkmanager closes stdin) cannot fail
          # the step; the pipeline still reports sdkmanager's own exit status.
          set +o pipefail
          yes | "${sdkmanager}" --sdk_root="${sdk_root}" --install "ndk;${NDK_VERSION}"
          set -o pipefail

          if [ ! -d "${sdk_root}/ndk/${NDK_VERSION}" ]; then
            echo "::error::NDK ${NDK_VERSION} was not installed under ${sdk_root}/ndk."
            exit 1
          fi
          echo "Installed NDK ${NDK_VERSION}."

      - name: Resolve Flutter dependencies
        run: flutter pub get

      # Gate the release on static analysis and the test suite. Both run before
      # the APK is built, so a broken build can never be published as a release.
      #
      # `flutter analyze` already defaults --fatal-infos and --fatal-warnings to
      # on (see flutter_tools/lib/src/commands/analyze.dart), so passing them
      # changes no behaviour today. They are spelled out so the gate stays
      # self-documenting instead of silently depending on a Flutter default that
      # has moved across releases.
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run the test suite
        run: flutter test --reporter expanded

      - name: Resolve HARBOR_API_BASE_URL
        id: api
        shell: bash
        env:
          API_BASE_URL: ${{ vars.HARBOR_API_BASE_URL }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api_base_url="${API_BASE_URL:-}"
          if [ -z "$api_base_url" ]; then
            # No live update server is configured. The client can fall back to
            # the static manifest and flags published on GitHub Pages, so point
            # it at the project Pages URL by default.
            api_base_url="https://${REPO%%/*}.github.io/${REPO##*/}/"
            echo "::warning::Repository variable HARBOR_API_BASE_URL is empty; falling back to Pages ${api_base_url}."
          fi
          echo "api_base_url=${api_base_url}" >> "$GITHUB_OUTPUT"
          echo "Using HARBOR_API_BASE_URL=${api_base_url}"
      - name: Build release APK
        shell: bash
        env:
          API_BASE_URL: ${{ steps.api.outputs.api_base_url }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          # --build-name sets the APK's versionName, and HARBOR_APP_VERSION is
          # what UpdateService compares against the server's latest_version.
          # Setting only one of them would make a fresh v1.0.1 install report
          # itself as the pubspec's 1.0.0 and prompt for its own update forever.
          flutter build apk --release \
            --build-name="${VERSION}" \
            --build-number="${BUILD_NUMBER}" \
            --dart-define=HARBOR_API_BASE_URL="${API_BASE_URL}" \
            --dart-define=HARBOR_APP_VERSION="${VERSION}"

      - name: Generate changelog
        id: changelog
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          staging="${GITHUB_WORKSPACE}/release-assets"
          mkdir -p "$staging"
          changelog="$staging/CHANGELOG.md"

          rev="HEAD"
          if git rev-parse -q --verify HEAD^ >/dev/null 2>&1; then
            rev="HEAD^"
          fi

          previous_tag=""
          if [ "$rev" != "HEAD" ]; then
            previous_tag="$(git describe --tags --abbrev=0 "$rev" 2>/dev/null || true)"
          fi

          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..HEAD"
          else
            range="HEAD"
          fi

          {
            echo "## Harbor ${VERSION}"
            echo
            if [ -n "$previous_tag" ]; then
              echo "Changes since \`${previous_tag}\`:"
            else
              echo "Changes since the first commit:"
            fi
            echo
            commits="$(git log --no-merges --pretty=format:'- %s (%h) - %an' "$range" || true)"
            if [ -n "$commits" ]; then
              printf '%s\n' "$commits"
            else
              echo "- No commit metadata available for range \`${range}\`."
            fi
            echo
            echo "_Release tag: \`${TAG}\` - commit \`${GITHUB_SHA:-unknown}\`._"
          } > "$changelog"

          if [ ! -s "$changelog" ]; then
            echo "::error::Generated changelog is empty."
            exit 1
          fi
          echo "changelog_path=${changelog}" >> "$GITHUB_OUTPUT"

      - name: Verify APK, compute checksum and stage assets
        id: checksum
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$apk" ]; then
            echo "::error::Expected APK at apps/main_app/${apk} was not produced."
            find build -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi

          size_bytes="$(stat -c '%s' "$apk")"
          if [ -z "$size_bytes" ] || [ "$size_bytes" -le 0 ]; then
            echo "::error::APK is empty (size=${size_bytes:-0} bytes)."
            exit 1
          fi

          sha256="$(sha256sum "$apk" | awk '{print $1}')"
          if ! printf '%s' "$sha256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::Computed SHA256 is not 64 lowercase hex characters: '${sha256}'."
            exit 1
          fi

          staging="${GITHUB_WORKSPACE}/release-assets"
          mkdir -p "$staging"
          cp "$apk" "$staging/app-release.apk"
          (
            cd "$staging"
            sha256sum app-release.apk > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          printf '%s\n' "$VERSION" > "$staging/version.txt"
          printf '%s\n' "$TAG" > "$staging/tag.txt"

          {
            echo "sha256=${sha256}"
            echo "size_bytes=${size_bytes}"
            echo "apk_path=${staging}/app-release.apk"
          } >> "$GITHUB_OUTPUT"

          echo "APK verified: ${size_bytes} bytes, sha256=${sha256}"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          path: release-assets
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-apk
    if: ${{ inputs.dry_run != true && needs.build-apk.result == 'success' && needs.build-apk.outputs.tag != '' && needs.build-apk.outputs.sha256 != '' && needs.build-apk.outputs.apk_path != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          path: release-assets

      - name: Verify downloaded assets
        shell: bash
        run: |
          set -euo pipefail
          for required in app-release.apk SHA256SUMS CHANGELOG.md; do
            if [ ! -s "release-assets/${required}" ]; then
              echo "::error::Artifact member release-assets/${required} is missing or empty."
              exit 1
            fi
          done
          ( cd release-assets && sha256sum -c SHA256SUMS )

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build-apk.outputs.tag }}
          VERSION: ${{ needs.build-apk.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          prerelease_args=()
          case "$TAG" in
            *-*) prerelease_args+=(--prerelease) ;;
          esac

          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; replacing its assets and notes."
            gh release upload "$TAG" \
              release-assets/app-release.apk \
              release-assets/SHA256SUMS \
              --repo "$REPOSITORY" \
              --clobber
            gh release edit "$TAG" \
              --repo "$REPOSITORY" \
              --title "Harbor ${VERSION}" \
              --notes-file release-assets/CHANGELOG.md \
              "${prerelease_args[@]}"
          else
            create_args=(
              --repo "$REPOSITORY"
              --title "Harbor ${VERSION}"
              --notes-file release-assets/CHANGELOG.md
            )
            if [ "${EVENT_NAME}" = "workflow_dispatch" ] && ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
              create_args+=(--target "${COMMIT_SHA}")
            fi
            gh release create "$TAG" \
              release-assets/app-release.apk \
              release-assets/SHA256SUMS \
              "${create_args[@]}" \
              "${prerelease_args[@]}"
          fi

          echo "### Release ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`${TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA256 | \`${{ needs.build-apk.outputs.sha256 }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Size (bytes) | ${{ needs.build-apk.outputs.size_bytes }} |" >> "$GITHUB_STEP_SUMMARY"

  publish-pages:
    name: Publish update manifest to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-apk
    if: ${{ inputs.dry_run != true && needs.build-apk.result == 'success' && needs.build-apk.outputs.sha256 != '' && needs.build-apk.outputs.version != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          path: release-assets

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dashboard build settings
        id: api
        shell: bash
        env:
          API_BASE_URL: ${{ vars.HARBOR_API_BASE_URL }}
          REPO: ${{ github.repository }}
          ADMIN_SUBDIR: ${{ env.ADMIN_BASE_HREF }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          api_base_url="${API_BASE_URL:-}"
          if [ -z "$api_base_url" ]; then
            # No live update server is configured. Point the dashboard at the
            # static Pages site by default; admins can still override it.
            api_base_url="https://${REPO%%/*}.github.io/${REPO##*/}/"
            echo "::warning::Repository variable HARBOR_API_BASE_URL is empty; falling back to Pages ${api_base_url}."
          fi

          # actions/configure-pages reports the path the site is served from:
          # empty for a user/organisation site, "/<repo>" for a project site.
          # The dashboard is served under that path, so its absolute base href
          # is base_path + subdirectory; omitting the prefix yields a page whose
          # index.html loads but whose main.dart.js 404s.
          base_path="${PAGES_BASE_PATH:-}"
          if [ "$base_path" = "/" ]; then
            base_path=""
          fi
          case "$base_path" in
            "") ;;
            /*) ;;
            *) base_path="/${base_path}" ;;
          esac
          base_path="${base_path%/}"

          subdir="${ADMIN_SUBDIR:-}"
          case "$subdir" in
            /*) ;;
            *) subdir="/${subdir}" ;;
          esac
          case "$subdir" in
            */) ;;
            *) subdir="${subdir}/" ;;
          esac
          if [ "$subdir" = "//" ] || [ "$subdir" = "/" ]; then
            subdir="/update-admin/"
          fi

          {
            echo "api_base_url=${api_base_url}"
            echo "base_href=${base_path}${subdir}"
          } >> "$GITHUB_OUTPUT"
          echo "Dashboard will call ${api_base_url} and be served from ${base_path}${subdir}."

      # actions/deploy-pages replaces the whole site, so this job publishes the
      # complete site — the dashboard that deploy_update_server.yml owns plus
      # the manifest this workflow owns — rather than only its own half.
      - name: Assemble the complete Pages site
        shell: bash
        env:
          SITE_DIR: ${{ github.workspace }}/site
          REPO: ${{ github.repository }}
          API_BASE_URL: ${{ steps.api.outputs.api_base_url }}
          ADMIN_BASE_HREF: ${{ steps.api.outputs.base_href }}
          MIN_SUPPORTED_VERSION: ${{ vars.HARBOR_MIN_SUPPORTED_VERSION }}
          VERSION: ${{ needs.build-apk.outputs.version }}
          TAG: ${{ needs.build-apk.outputs.tag }}
          SHA256: ${{ needs.build-apk.outputs.sha256 }}
          SIZE_BYTES: ${{ needs.build-apk.outputs.size_bytes }}
          CHANGELOG_FILE: ${{ github.workspace }}/release-assets/CHANGELOG.md
        run: bash .github/scripts/build_pages_site.sh

      - name: Pages summary
        shell: bash
        env:
          VERSION: ${{ needs.build-apk.outputs.version }}
          TAG: ${{ needs.build-apk.outputs.tag }}
          SIZE_BYTES: ${{ needs.build-apk.outputs.size_bytes }}
          ADMIN_BASE_HREF: ${{ steps.api.outputs.base_href }}
        run: |
          set -euo pipefail
          {
            echo "### Pages site published"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| latest_version | \`${VERSION}\` |"
            echo "| tag | \`${TAG}\` |"
            echo "| size_bytes | ${SIZE_BYTES} |"
            echo "| dashboard | \`${ADMIN_BASE_HREF}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
